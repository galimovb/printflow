# WB studio alone: no Ozon products or order handlers, so it never doubles another PrintFlow instance.
# Own data folder: jobs created by earlier local runs are never picked up by this queue.
#   docker compose -f docker-compose.yml -f docker-compose.wb.yml up -d --build
services:
  migrate:
    volumes:
      - printflow-wb-db:/data
  app:
    volumes:
      # jobs.db on a Linux volume: on the Windows folder mount a scan took minutes and WAL was impossible.
      - printflow-wb-db:/data
      - ./data-wb-queue/logs:/data/logs
      - ./wb_studio/config/config.json:/app/printflow/wb_studio/config/config.json:ro
    environment:
      PRINTFLOW_PRODUCTS_ENABLED: "0"
      PRINTFLOW_WB_ENABLED: "1"
      PRINTFLOW_WB_AUTO_PUBLISH: "${PRINTFLOW_WB_AUTO_PUBLISH:-0}"
      PRINTFLOW_WB_HEADLESS: "0"
      PRINTFLOW_LOG_DIR: /data/logs
      PRINTFLOW_SQLITE_JOURNAL: WAL
      PRINTFLOW_WB_PHOTO_QUALITY: "${PRINTFLOW_WB_PHOTO_QUALITY:-low}"
      PRINTFLOW_WB_EXTRACT_QUALITY: "${PRINTFLOW_WB_EXTRACT_QUALITY:-medium}"
      PRINTFLOW_WB_IMAGE_QUALITY: "${PRINTFLOW_WB_IMAGE_QUALITY:-medium}"
      PRINTFLOW_WB_TEMPLATE_QUALITY: "${PRINTFLOW_WB_TEMPLATE_QUALITY:-medium}"
      PRINTFLOW_WB_FRAME_CHECK: "${PRINTFLOW_WB_FRAME_CHECK:-0}"
      PRINTFLOW_WB_REASONING_EFFORT: "${PRINTFLOW_WB_REASONING_EFFORT:-low}"
      PRINTFLOW_WB_ANALYSIS_MODEL: "${PRINTFLOW_WB_ANALYSIS_MODEL:-gpt-6.1-sol}"

# Created once by hand (docker volume create printflow-wb-db), so docker compose down -v never deletes the queue.
volumes:
  printflow-wb-db:
    external: true
